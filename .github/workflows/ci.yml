name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # The suite is offline: recorded transcripts, a fake driver, no API
      # credits. If it ever needs network access, this is the step that will
      # show it.
      - run: go test -count=1 ./...
      - run: go build ./cmd/golunch
      # Proves the module is installable by path, which is the point of having
      # one, and that version reporting works without an -ldflags stamp.
      - name: go install smoke
        run: |
          go install ./cmd/golunch
          "$(go env GOPATH)/bin/golunch" version
          "$(go env GOPATH)/bin/golunch" doctor
